<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>年収エージェント アナリティクス</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb; --plane: #f9f9f7;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
    --track: rgba(11,11,11,0.05);
    --warn-ink: #7a5200; --warn-bg: rgba(250,178,25,0.13); --warn-line: rgba(250,178,25,0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19; --plane: #0d0d0d;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
      --track: rgba(255,255,255,0.07);
      --warn-ink: #fab219; --warn-bg: rgba(250,178,25,0.10); --warn-line: rgba(250,178,25,0.32);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --plane: #0d0d0d; --text-primary: #fff; --text-secondary: #c3c2b7;
    --muted: #898781; --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --track: rgba(255,255,255,0.07);
    --warn-ink: #fab219; --warn-bg: rgba(250,178,25,0.10); --warn-line: rgba(250,178,25,0.32);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--plane); color: var(--text-primary);
         font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .app-shell { min-height: 100vh; display: grid; grid-template-columns: 224px minmax(0, 1fr); }
  .sidebar { position: sticky; top: 0; height: 100vh; padding: 24px 16px; background: #101827; color: #fff;
             border-right: 1px solid rgba(255,255,255,.08); }
  .brand { padding: 0 10px 22px; border-bottom: 1px solid rgba(255,255,255,.10); }
  .brand strong { display: block; font-size: 15px; letter-spacing: -.01em; }
  .brand span { display: block; margin-top: 3px; color: #9ba8bc; font-size: 11px; }
  .nav-group { margin-top: 22px; }
  .nav-label { margin: 0 10px 8px; color: #718096; font-size: 10px; font-weight: 700; letter-spacing: .08em; }
  .tabs { display: grid; gap: 5px; }
  .tab { width: 100%; appearance: none; background: transparent; border: 0; padding: 10px 12px; border-radius: 9px;
         color: #b8c2d1; font: inherit; font-size: 13px; font-weight: 600; text-align: left; cursor: pointer; }
  .tab::before { display: inline-grid; place-items: center; width: 22px; margin-right: 7px; color: #8290a6; font-size: 11px; }
  .tab[data-tab="overview"]::before { content: "●"; }
  .tab[data-tab="yt"]::before { content: "▶"; }
  .tab[data-tab="ga"]::before { content: "↗"; }
  .tab:hover { color: #fff; background: rgba(255,255,255,.07); }
  .tab[aria-selected="true"] { color: #fff; background: rgba(92,122,184,.34); box-shadow: inset 0 0 0 1px rgba(160,181,225,.16); }
  .tab:focus-visible, .btn:focus-visible, select:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
  .wrap { width: 100%; max-width: 1280px; margin: 0 auto; padding: 28px 28px 56px; }

  header.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; }
  .sub { color: var(--text-secondary); font-size: 13px; margin: 4px 0 14px; }
  .sub code { font-size: 12px; background: var(--track); padding: 1px 5px; border-radius: 4px; }

  .statusbar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 2px 0 16px; }
  .statusitem { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0;
                background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .statusitem .source { color: var(--text-secondary); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px;
           font-size: 11px; font-weight: 650; background: var(--track); color: var(--muted); }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.ok { color: #087f5b; background: rgba(27,175,122,.11); }
  .badge.warn { color: var(--warn-ink); background: var(--warn-bg); }
  .badge.error { color: #c23b22; background: rgba(194,59,34,.10); }
  .btn { appearance: none; font: inherit; font-weight: 600; padding: 7px 13px; border-radius: 8px;
         border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); cursor: pointer; }
  .btn:hover { background: var(--track); }
  select { font: inherit; font-size: 13px; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--border);
           background: var(--surface-1); color: var(--text-primary); }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .controls label { color: var(--text-secondary); font-size: 12px; }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .card > h2 { font-size: 14px; margin: 0 0 2px; }
  .card > .note { color: var(--muted); font-size: 12px; margin: 0 0 16px; }
  .note { color: var(--muted); font-size: 12px; margin: 0; }
  .help { display: inline-grid; place-items: center; width: 17px; height: 17px; margin-left: 5px; padding: 0;
          border: 1px solid var(--axis); border-radius: 50%; background: transparent; color: var(--muted);
          font: 700 11px/1 system-ui, sans-serif; vertical-align: 1px; cursor: help; }
  .help:hover, .help:focus-visible { color: var(--series-1); border-color: var(--series-1); outline: none; }
  code { background: var(--track); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 15px 17px; }
  .tile .k { color: var(--text-secondary); font-size: 12px; }
  .tile .v { font-size: 28px; font-weight: 650; line-height: 1.18; margin-top: 5px; letter-spacing: -.012em; }
  .tile .m { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
  .delta { display: inline-flex; align-items: center; margin-top: 7px; padding: 2px 7px; border-radius: 999px;
           font-size: 11px; font-weight: 700; background: var(--track); color: var(--muted); }
  .delta.up { color: #087f5b; background: rgba(27,175,122,.11); }
  .delta.down { color: #c23b22; background: rgba(194,59,34,.10); }

  .hrow { display: grid; grid-template-columns: minmax(0,1fr) 52% auto; gap: 12px; align-items: center; padding: 4px 0; }
  .hlabel { color: var(--text-secondary); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .htrack { background: var(--track); border-radius: 0 4px 4px 0; height: 16px; }
  .hbar { height: 100%; border-radius: 0 4px 4px 0; background: var(--series-1); min-width: 2px; }
  .hbar.alt { background: var(--series-3); }
  .hbar.alt2 { background: var(--series-2); }
  .hval { font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; min-width: 72px; }

  .plot { position: relative; height: 200px; margin: 8px 0 0 46px; }
  .gridline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--grid); }
  .gridline:first-child { border-top-color: var(--axis); }
  .gridline span { position: absolute; right: 100%; padding-right: 8px; transform: translateY(-50%);
                   color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cols { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 2px; }
  .colwrap { flex: 1 1 0; height: 100%; display: flex; align-items: flex-end; min-width: 0; }
  .colbar { width: 100%; background: var(--series-1); border-radius: 4px 4px 0 0; min-height: 2px; }
  .colbar.alt { background: var(--series-3); }
  .colwrap:hover .colbar { opacity: .78; }
  .xaxis { display: flex; gap: 2px; margin: 6px 0 0 46px; }
  /* 目盛りは1本おきにしか描かないので、はみ出しを許して潰さない */
  .xaxis span { flex: 1 1 0; min-width: 0; text-align: center; color: var(--muted); font-size: 10.5px; overflow: visible; white-space: nowrap; }

  .scroll { overflow-x: auto; }
  .table-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 10px; }
  .table-tools input, .table-tools select { min-height: 34px; }
  .table-tools input { flex: 1 1 240px; min-width: 160px; font: inherit; padding: 6px 9px; border-radius: 8px;
                       border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); }
  .table-count { color: var(--muted); font-size: 12px; margin-left: auto; }
  .analysis-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 0 0 14px; }
  .analysis-controls label { display: grid; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 650; }
  .analysis-controls select { min-height: 34px; min-width: 130px; }
  .period-table td:first-child { white-space: nowrap; font-weight: 650; }
  .partial { display: inline-block; margin-left: 5px; padding: 1px 5px; border-radius: 999px; background: var(--track); color: var(--muted); font-size: 10px; }
  .analyze-video { margin-top: 6px; padding: 4px 8px; min-height: 28px; font-size: 11px; }
  .video-detail { margin: 14px 0; border: 1px solid var(--series-1); }
  .video-detail-head { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .video-detail-head img { width: 120px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: var(--track); }
  .video-detail-head h3 { margin: 0 0 5px; font-size: 15px; }
  .video-detail-head p { margin: 0; }
  .detail-loading { padding: 28px; text-align: center; color: var(--muted); }
  .pager { display: flex; justify-content: flex-end; align-items: center; gap: 9px; margin-top: 12px; }
  .pager span { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-secondary); font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; user-select: none; }
  thead th { position: sticky; top: 0; z-index: 2; background: var(--surface-1); }
  th:hover { color: var(--text-primary); }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tbody tr:hover { background: var(--track); }
  td a { color: var(--series-1); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .video-table td:first-child { min-width: 260px; max-width: 420px; }
  .video-table td:first-child a { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .setup { border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .setup h2 { font-size: 13px; margin: 0 0 4px; color: var(--warn-ink); letter-spacing: .01em; }
  .setup p { margin: 0; font-size: 13px; color: var(--text-secondary); }
  .setup details { margin-top: 8px; }
  .setup summary { cursor: pointer; color: var(--warn-ink); font-size: 12px; font-weight: 650; }
  .setup ol { margin: 8px 0 0; padding-left: 20px; }
  .setup li { margin-bottom: 5px; color: var(--text-secondary); font-size: 13px; }

  #tip { position: fixed; z-index: 30; pointer-events: none; opacity: 0;
         background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border);
         border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 24px rgba(0,0,0,.14); max-width: 290px; }
  #tip b { display: block; margin-bottom: 3px; }
  #tip .r { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  .hide { display: none !important; }
  .skeleton { height: 88px; border-radius: 12px; margin-bottom: 12px; background: linear-gradient(90deg, var(--track), var(--surface-1), var(--track)); background-size: 200% 100%; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { to { background-position: -200% 0; } }
  footer { color: var(--muted); font-size: 12px; margin-top: 26px; border-top: 1px solid var(--border); padding-top: 14px; }
  .overview-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .overview-card { appearance: none; width: 100%; text-align: left; color: var(--text-primary); cursor: pointer; }
  .overview-card:hover { border-color: rgba(42,120,214,.35); }
  .overview-card .arrow { float: right; color: var(--series-1); font-weight: 700; }
  .overview-data { margin-top: 16px; }
  .section-title { margin: 22px 0 10px; font-size: 16px; letter-spacing: -.01em; }
  .actions { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .actions li { padding: 10px 12px; border-left: 3px solid var(--series-1); background: var(--track); border-radius: 0 8px 8px 0; }
  .funnel { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: stretch; }
  .funnel-step { position: relative; padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-1); }
  .funnel-step:not(:last-child)::after { content: '→'; position: absolute; right: -10px; top: 42%; z-index: 2; color: var(--series-1); font-weight: 800; }
  .funnel-step .stage { color: var(--muted); font-size: 11px; font-weight: 700; }
  .funnel-step .value { margin: 5px 0; font-size: 24px; font-weight: 780; font-variant-numeric: tabular-nums; }
  .funnel-step .rate { color: var(--text-secondary); font-size: 12px; }
  .diagnosis { border-left: 4px solid var(--series-1); padding: 13px 15px; background: rgba(42,120,214,.06); border-radius: 8px; margin: 12px 0; }
  .diagnosis strong { display: block; margin-bottom: 4px; }
  .measurement-note { display: flex; flex-wrap: wrap; gap: 7px 14px; margin-top: 10px; color: var(--muted); font-size: 11px; }
  .mom { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; white-space: nowrap; }
  .mom.up { color: var(--ok); }
  .mom.down { color: var(--danger); }
  @media (max-width: 720px) {
    .funnel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .analysis-controls label { flex: 1 1 130px; }
    .analysis-controls select { width: 100%; min-width: 0; }
    .video-detail-head { align-items: flex-start; }
    .video-detail-head img { width: 92px; }
    .funnel-step:not(:last-child)::after { display: none; }
    .app-shell { display: block; }
    .sidebar { position: sticky; top: 0; z-index: 10; width: auto; height: auto; padding: 10px 14px; }
    .brand { display: none; }
    .nav-group { margin-top: 12px; }
    .nav-label { display: none; }
    .tabs { display: flex; overflow-x: auto; }
    .tab { flex: 0 0 auto; width: auto; white-space: nowrap; }
    .wrap { padding: 18px 14px 40px; }
    header.top { align-items: flex-start; }
    header.top .controls { width: 100%; }
    .statusbar { grid-template-columns: 1fr; gap: 7px; }
    .overview-grid { grid-template-columns: 1fr; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .tile { padding: 12px; }
    .tile .v { font-size: 23px; }
    .card { padding: 14px; }
    .hrow { grid-template-columns: minmax(100px, 1fr) 42% auto; gap: 7px; }
  }
</style>
</head>
<body>
<div class="app-shell">
<aside class="sidebar" aria-label="メインメニュー">
  <div class="brand"><strong>年収エージェント</strong><span>YouTube アナリティクス</span></div>
  <nav class="nav-group">
    <p class="nav-label">ダッシュボード</p>
    <div class="tabs" role="tablist" aria-label="分析メニュー">
      <button class="tab" role="tab" aria-selected="true" data-tab="overview">概要</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="yt">YouTube分析</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="ga">サイト送客・CV</button>
    </div>
  </nav>
</aside>
<main class="wrap">
  <header class="top">
    <div>
      <h1>年収エージェント アナリティクス</h1>
      <p class="sub" id="sub">動画の伸びと、年収エージェントへの送客成果を一画面で評価</p>
    </div>
    <div class="controls" style="margin:0">
      <label for="range">期間</label>
      <select id="range">
        <option value="28">直近28日</option>
        <option value="90" selected>直近90日</option>
        <option value="180">直近180日</option>
        <option value="365">直近365日</option>
      </select>
      <button class="btn" id="reload" type="button">再読み込み</button>
    </div>
  </header>

  <div class="statusbar" aria-label="データ接続状況">
    <div class="statusitem"><span class="source">YouTube Analytics</span><span class="badge" id="status-yt">確認中</span></div>
    <div class="statusitem"><span class="source">サイト送客・CV（GA4）</span><span class="badge" id="status-ga">確認中</span></div>
  </div>

  <section id="panel-overview">
    <div class="overview-grid">
      <button class="card overview-card" type="button" data-open-tab="yt">
        <span class="arrow">→</span><h2>YouTube分析</h2>
        <p class="note">再生数だけでなく、視聴維持率・総再生時間・登録者増減・伸びた動画を確認します。</p>
      </button>
      <button class="card overview-card" type="button" data-open-tab="ga">
        <span class="arrow">→</span><h2>サイト送客・CV</h2>
        <p class="note">YouTube概要欄からの遷移、問い合わせ完了、動画別の送客成果を確認します。</p>
      </button>
    </div>
    <div id="overview-data" class="overview-data"></div>
  </section>
  <section id="panel-yt" class="hide"><div id="yt-body"></div></section>
  <section id="panel-ga" class="hide"><div id="ga-body"></div></section>

  <footer>
    出典：YouTube Data API v3（公開指標）／ YouTube Analytics API v2（非公開指標）／ GA4 Data API（<code>/nensyuagent/</code> 絞り込み）。
    YouTubeの反応とサイト送客を分けて確認し、再生数だけで成果判断しません。
  </footer>
</main>
</div>
<div id="tip" role="tooltip"></div>

<script>
(function () {
  'use strict';

  var tip = document.getElementById('tip');
  var pinnedHelp = null;
  function showTip(html, ev) {
    tip.innerHTML = html; tip.style.opacity = '1';
    var pad = 14, r = tip.getBoundingClientRect();
    tip.style.left = Math.min(ev.clientX + pad, window.innerWidth - r.width - 8) + 'px';
    tip.style.top = Math.max(8, ev.clientY - r.height - pad) + 'px';
  }
  function hideTip(force) {
    if (!force && pinnedHelp) return;
    tip.style.opacity = '0';
    if (force) pinnedHelp = null;
  }

  var HELP = {
    '登録者数': 'YouTube Data APIの現在値です。期間指定の影響を受けないチャンネル累計値です。',
    'チャンネル総再生回数': 'YouTube Data APIが返すチャンネル全期間の累計視聴回数です。選択期間内の値ではありません。',
    '期間内 視聴回数': 'YouTube Analytics APIのviewsを選択期間で集計します。確定待ちを避けるため直近2日を除外しています。',
    'YouTube 視聴回数': 'YouTube Analytics APIのviewsを選択期間で集計した値です。前期間比は直前の同じ日数と比較します。',
    '期間内 登録者純増': '選択期間のsubscribersGainedからsubscribersLostを引いた値です。',
    '登録者純増': '選択期間の登録者増加数から登録解除数を引いた値です。',
    '平均視聴維持率': 'YouTube Analytics APIのaverageViewPercentageを期間全体・動画別に取得します。動画の何％まで平均して視聴されたかを示します。',
    '総再生時間': 'YouTube Analytics APIのestimatedMinutesWatchedです。画面では時間または分に換算します。',
    'セッション': 'GA4のsessionsです。/nensyuagent本体と配下で開始・継続したセッションを選択期間で集計します。',
    'ユーザー': 'GA4のactiveUsersを期間全体で取得した重複除外値です。日別ユーザー数の合計ではありません。',
    'ページビュー': 'GA4のscreenPageViewsです。/nensyuagent本体と配下のページ表示回数を合計します。',
    '問い合わせ完了': 'GA4のeventNameが「CV_求職者all」と完全一致するプロパティ全体のeventCountです。このイベント名自体が年収エージェントの求職者CVを識別します。',
    'YouTube概要欄 遷移セッション': 'GA4のsessionManualAdContentが「agent-ch_desc」と完全一致し、/nensyuagent/へ到達したセッションです。',

  function helpText(label) {
    if (HELP[label]) return HELP[label];
    var key = Object.keys(HELP).filter(function (k) { return String(label).indexOf(k) === 0; })
      .sort(function (a, b) { return b.length - a.length; })[0];
    return key ? HELP[key] : '';
  }

  function helpIcon(label) {
    var text = helpText(label);
    return text ? '<button class="help" type="button" aria-label="' + esc(label) + 'の計測方法と補足" data-help="' + esc(text) + '">?</button>' : '';
  }

  function showHelp(button, ev) {
    var r = button.getBoundingClientRect();
    showTip('<b>' + esc(button.getAttribute('aria-label').replace('の計測方法と補足', '')) + '</b><span class="r">' +
      esc(button.getAttribute('data-help')) + '</span>', ev && ev.clientX ? ev : { clientX: r.left, clientY: r.top });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function nf(n) { return Number(n || 0).toLocaleString('ja-JP', { maximumFractionDigits: 2 }); }
  function compact(n) {
    n = Number(n || 0);
    if (n >= 1e8) return (n / 1e8).toFixed(1) + '億';
    if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e5 ? 0 : 1) + '万';
    return nf(n);
  }
  function pct(x, d) { return (Number(x || 0)).toFixed(d == null ? 1 : d) + '%'; }
  function hms(sec) {
    sec = Math.round(Number(sec) || 0);
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(s).padStart(2, '0');
  }
  function watchAmount(minutes) {
    minutes = Number(minutes) || 0;
    return minutes < 60 ? nf(Math.round(minutes)) + ' 分' : nf(Math.round(minutes / 60)) + ' 時間';
  }
  // GA4 は "20260829"、YouTube Analytics は "2026-08-29" を返す
  function normDate(v) {
    v = String(v);
    return /^\d{8}$/.test(v) ? v.slice(0, 4) + '-' + v.slice(4, 6) + '-' + v.slice(6) : v;
  }
  function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
  function sum(arr, key) { return arr.reduce(function (a, r) { return a + (Number(r[key]) || 0); }, 0); }

  function tiles(list) {
    var host = el('<div class="tiles"></div>');
    list.forEach(function (t) {
      host.appendChild(el('<div class="tile"><div class="k">' + esc(t[0]) + helpIcon(t[0]) + '</div><div class="v">' +
        esc(t[1]) + '</div><div class="m">' + esc(t[2] || '') + '</div>' +
        (t[3] ? '<span class="delta ' + esc(t[3].state || '') + '">' + esc(t[3].label) + '</span>' : '') + '</div>'));
    });
    return host;
  }

  function delta(current, previous, comparisonLabel) {
    current = Number(current) || 0; previous = Number(previous) || 0;
    comparisonLabel = comparisonLabel || '前期間比';
    if (!previous) return { label: current ? comparisonLabel.replace('比', '') + 'データなし' : comparisonLabel + ' 0.0%', state: '' };
    var rate = (current - previous) / previous * 100;
    return { label: (rate >= 0 ? '↑ ' : '↓ ') + Math.abs(rate).toFixed(1) + '% ' + comparisonLabel,
      state: rate > 0 ? 'up' : rate < 0 ? 'down' : '' };
  }

  function mom(current, previous, partial) {
    current = Number(current) || 0; previous = Number(previous) || 0;
    if (!previous) return '<span class="mom">前月データなし</span>';
    var rate = (current - previous) / Math.abs(previous) * 100;
    return '<span class="mom ' + (rate > 0 ? 'up' : rate < 0 ? 'down' : '') + '">' +
      (rate >= 0 ? '↑ ' : '↓ ') + Math.abs(rate).toFixed(1) + '% 前月比' + (partial ? '（途中）' : '') + '</span>';
  }

  function barChart(rows, opts) {
    opts = opts || {};
    var max = 0;
    rows.forEach(function (r) { max = Math.max(max, Math.abs(r.value)); });
    if (!max) max = 1;
    var wrap = document.createElement('div');
    rows.forEach(function (r) {
      var w = (Math.abs(r.value) / max) * 100;
      var node = el('<div class="hrow"><div class="hlabel" title="' + esc(r.label) + '">' + esc(r.label) + '</div>' +
        '<div class="htrack"><div class="hbar ' + (opts.variant || '') + '" style="width:' + w.toFixed(2) + '%"></div></div>' +
        '<div class="hval">' + esc(opts.format ? opts.format(r.value) : nf(r.value)) + '</div></div>');
      if (r.tip) {
        node.addEventListener('mousemove', function (ev) { showTip(r.tip, ev); });
        node.addEventListener('mouseleave', hideTip);
      }
      wrap.appendChild(node);
    });
    return wrap;
  }

  function niceCeil(v) {
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    var n = v / mag;
    var s = n <= 1 ? 1 : n <= 1.5 ? 1.5 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 3 ? 3 : n <= 4 ? 4 : n <= 5 ? 5 : n <= 8 ? 8 : 10;
    return s * mag;
  }

  function columnChart(points, opts) {
    opts = opts || {};
    var max = 0;
    points.forEach(function (p) { max = Math.max(max, p.value); });
    var top = niceCeil(max || 1);
    var host = document.createElement('div');
    var plot = el('<div class="plot"></div>');
    for (var t = 0; t <= 4; t++) {
      var frac = t / 4;
      plot.appendChild(el('<div class="gridline" style="bottom:' + (frac * 100) + '%"><span>' +
        esc(opts.axisFormat ? opts.axisFormat(top * frac) : compact(top * frac)) + '</span></div>'));
    }
    var cols = el('<div class="cols"></div>');
    points.forEach(function (p) {
      var h = (p.value / top) * 100;
      var c = el('<div class="colwrap"><div class="colbar ' + (opts.variant || '') + '" style="height:' +
        Math.max(h, 0.6).toFixed(2) + '%"></div></div>');
      c.addEventListener('mousemove', function (ev) {
        showTip(p.tip || ('<b>' + esc(p.label) + '</b><span class="r">' + esc(nf(p.value)) + '</span>'), ev);
      });
      c.addEventListener('mouseleave', hideTip);
      cols.appendChild(c);
    });
    plot.appendChild(cols);
    host.appendChild(plot);
    var ax = el('<div class="xaxis"></div>');
    var step = Math.max(1, Math.ceil(points.length / 12));
    points.forEach(function (p, i) { ax.appendChild(el('<span>' + esc(i % step === 0 ? p.short : '') + '</span>')); });
    host.appendChild(ax);
    return host;
  }

  function sortableTable(cols, rows, options) {
    options = options || {};
    var state = { key: options.defaultSort || null, dir: -1, query: '', filter: 'all', page: 1 };
    var host = el('<div class="scroll"></div>');
    var table = document.createElement('table');
    var tools = null, count = null, pager = null;
    if (options.explore) {
      tools = el('<div class="table-tools"><input type="search" aria-label="動画タイトルを検索" placeholder="動画タイトルを検索">' +
        '<select aria-label="動画の長さ"><option value="all">すべての動画</option><option value="long">61秒以上</option><option value="short">60秒以下</option></select>' +
        '<span class="table-count"></span></div>');
      count = tools.querySelector('.table-count');
      tools.querySelector('input').addEventListener('input', function (e) { state.query = e.target.value; state.page = 1; draw(); });
      tools.querySelector('select').addEventListener('change', function (e) { state.filter = e.target.value; state.page = 1; draw(); });
      host.appendChild(tools);
    }
    host.appendChild(table);
    if (options.explore) table.className = 'video-table';
    if (options.explore) { pager = el('<div class="pager"></div>'); host.appendChild(pager); }
    function draw() {
      var data = rows.filter(function (r) {
        var textOk = !state.query || String(r.title || '').toLowerCase().indexOf(state.query.toLowerCase()) >= 0;
        var typeOk = state.filter === 'all' || (state.filter === 'short' ? r.isShort : !r.isShort);
        return textOk && typeOk;
      });
      if (state.key) {
        var c = cols.filter(function (x) { return x.key === state.key; })[0];
        data.sort(function (a, b) {
          var av = a[state.key], bv = b[state.key];
          if (c && c.num) return ((Number(av) || 0) - (Number(bv) || 0)) * state.dir;
          return String(av).localeCompare(String(bv), 'ja') * state.dir;
        });
      }
      var total = data.length, pageSize = options.pageSize || 20;
      var pages = Math.max(1, Math.ceil(total / pageSize));
      state.page = Math.min(state.page, pages);
      if (options.explore) data = data.slice((state.page - 1) * pageSize, state.page * pageSize);
      table.innerHTML = '<thead><tr>' + cols.map(function (c) {
        return '<th class="' + (c.num ? 'num' : '') + '" data-k="' + esc(c.key) + '">' + esc(c.head) + helpIcon(c.head) +
          (state.key === c.key ? (state.dir < 0 ? ' ↓' : ' ↑') : '') + '</th>';
      }).join('') + '</tr></thead><tbody>' + data.map(function (r) {
        return '<tr>' + cols.map(function (c) {
          return '<td class="' + (c.num ? 'num' : '') + '">' + (c.render ? c.render(r) : esc(r[c.key])) + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody>';
      Array.prototype.forEach.call(table.querySelectorAll('th'), function (th) {
        th.addEventListener('click', function () {
          var k = th.getAttribute('data-k');
          if (state.key === k) state.dir = -state.dir; else { state.key = k; state.dir = -1; }
          draw();
        });
      });
      if (options.explore) {
        count.textContent = nf(total) + '件';
        pager.innerHTML = '<button class="btn" type="button" data-p="prev" ' + (state.page <= 1 ? 'disabled' : '') + '>前へ</button>' +
          '<span>' + state.page + ' / ' + pages + 'ページ</span>' +
          '<button class="btn" type="button" data-p="next" ' + (state.page >= pages ? 'disabled' : '') + '>次へ</button>';
        Array.prototype.forEach.call(pager.querySelectorAll('button'), function (b) {
          b.addEventListener('click', function () { state.page += b.dataset.p === 'next' ? 1 : -1; draw(); tools.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
        });
      }
    }
    draw();
    return host;
  }

  function card(title, note, node) {
    var c = el('<div class="card"><h2>' + esc(title) + helpIcon(title) + '</h2><p class="note">' + esc(note || '') + '</p></div>');
    c.appendChild(node);
    return c;
  }

  function setupCard(title, message, steps) {
    var detail = steps.length ? '<details><summary>接続手順を表示</summary><ol>' +
      steps.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol></details>' : '';

  }

  function setStatus(id, label, state) {
    var node = document.getElementById('status-' + id);
    node.textContent = label;
    node.className = 'badge ' + (state || '');
  }

  // 日次のままだと90本以上は読めないので、45本を超えたら週次に丸める
  function dailyPoints(rows, dateKey, valueKey, label) {
    var pts = rows.map(function (r) {
      return { date: normDate(r[dateKey]), value: Number(r[valueKey]) || 0 };
    });
    if (pts.length <= 45) {
      return pts.map(function (p) {
        return { label: p.date, short: p.date.slice(5), value: p.value,
          tip: '<b>' + esc(p.date) + '</b><span class="r">' + esc(label) + ' ' + esc(nf(p.value)) + '</span>' };
      });
    }
    var weeks = [];
    for (var i = 0; i < pts.length; i += 7) {
      var chunk = pts.slice(i, i + 7);
      var total = chunk.reduce(function (a, p) { return a + p.value; }, 0);
      var from = chunk[0].date, to = chunk[chunk.length - 1].date;
      weeks.push({ label: from, short: from.slice(5), value: total,
        tip: '<b>' + esc(from) + ' 〜 ' + esc(to) + '</b><span class="r">' + esc(label) + ' ' + esc(nf(total)) +
             '<br>1日平均 ' + esc(nf(Math.round(total / chunk.length))) + '</span>' });
    }
    return weeks;
  }

  function getJSON(path) {
    return fetch(path).then(function (r) {
      return r.json().catch(function () { return {}; })
        .then(function (b) { return { ok: r.ok, status: r.status, body: b, path: path }; });
    });
  }

  function loadVideoDetail(videoId, detailHost) {
    detailHost.classList.remove('hide');
    detailHost.innerHTML = '<div class="detail-loading">動画データを取得しています…</div>';
    detailHost.scrollIntoView({ behavior: 'smooth', block: 'start' });
    getJSON('/api/youtube-analytics?days=' + days + '&videoId=' + encodeURIComponent(videoId)).then(function (r) {
      if (!r.ok) {
        detailHost.innerHTML = '<div class="setup"><h2>動画詳細を取得できませんでした</h2><p>' + esc((r.body && r.body.message) || '通信エラー') + '</p></div>';
        return;
      }
      var d = r.body, s = d.summary || {}, p = d.previousSummary || {}, v = d.video || {};
      var net = (Number(s.subscribersGained) || 0) - (Number(s.subscribersLost) || 0);
      var prevNet = (Number(p.subscribersGained) || 0) - (Number(p.subscribersLost) || 0);
      var views = Number(s.views) || 0;
      detailHost.innerHTML = '<div class="video-detail-head">' +
        (v.thumbnail ? '<img src="' + esc(v.thumbnail) + '" alt="">' : '') + '<div><h3>' + esc(v.title || videoId) + '</h3>' +
        '<p class="note">' + esc(d.period.startDate + ' 〜 ' + d.period.endDate) + ' ・ 最新' + esc(d.lagDays) + '日を除外</p>' +
        '<p><a href="https://www.youtube.com/watch?v=' + esc(videoId) + '" target="_blank" rel="noopener">YouTubeで動画を開く ↗</a></p></div></div>';
      detailHost.appendChild(tiles([
        ['期間内視聴回数', compact(views), nf(views) + ' 回', delta(views, p.views)],
        ['総再生時間', watchAmount(s.estimatedMinutesWatched), '選択期間', delta(s.estimatedMinutesWatched, p.estimatedMinutesWatched)],
        ['平均視聴時間', hms(s.averageViewDuration), '1視聴あたり', delta(s.averageViewDuration, p.averageViewDuration)],
        ['平均視聴維持率', pct(s.averageViewPercentage, 1), '期間全体の公式集計', delta(s.averageViewPercentage, p.averageViewPercentage)],
        ['登録者純増', (net >= 0 ? '+' : '') + nf(net), '増加 ' + nf(s.subscribersGained) + ' / 解除 ' + nf(s.subscribersLost), delta(net, prevNet)],
        ['登録者純増 / 1,000視聴', views ? nf(net / views * 1000) : '—', '動画の登録獲得効率']
      ]));
      if ((d.daily || []).length) detailHost.appendChild(card('動画詳細分析', '日次・暦週（月曜始まり）・暦月に切り替えられます。維持率は日次値の視聴回数加重参考値です。',
        timeAnalysis(d.daily, days <= 28 ? 'day' : days <= 180 ? 'week' : 'month')));
    }).catch(function (e) {
      detailHost.innerHTML = '<div class="setup"><h2>動画詳細を取得できませんでした</h2><p>' + esc(e.message) + '</p></div>';
    });
  }

  // Basic認証がかかっている場合、fetch の 401 ではブラウザの認証ダイアログが出ない。
  // 同じURLを新しいタブで「ページとして」開けばダイアログが出て、以降は fetch も通る。
  function authCard(path) {
    var c = el('<div class="setup"><h2>認証が必要です</h2>' +
      '<p>このダッシュボードは Basic 認証で保護されています。下のボタンで一度認証してから再読み込みしてください。</p></div>');
    var b = el('<button class="btn" type="button">認証する（新しいタブが開きます）</button>');
    b.addEventListener('click', function () { window.open(path, '_blank', 'noopener'); });

    return c;
  }

  function renderYouTube(pub, ana) {
    var host = document.getElementById('yt-body');
    host.innerHTML = '';

  function conversionBuckets(ytRows, sessionRows, inquiryRows, unit, startDate, endDate) {
    var groups = {};
    function group(date) {
      var b = bucketInfo(date, unit);
      return groups[b.key] || (groups[b.key] = { period: b.key, start: b.start, end: b.end, views: 0, sessions: 0, inquiries: 0 });
    }
    (ytRows || []).forEach(function (r) { group(r.day).views += Number(r.views) || 0; });
    (sessionRows || []).forEach(function (r) {
      var date = normDate(r.date); if (date >= startDate && date <= endDate) group(date).sessions += Number(r.sessions) || 0;
    });
    (inquiryRows || []).forEach(function (r) {
      var date = normDate(r.date); if (date >= startDate && date <= endDate) group(date).inquiries += Number(r.eventCount) || 0;
    });
    return Object.keys(groups).sort().map(function (k) {
      var g = groups[k];
      g.sessionPerK = g.views ? g.sessions / g.views * 1000 : 0;
      g.inquiryRate = g.sessions ? g.inquiries / g.sessions : 0;
      g.inquiryPerK = g.views ? g.inquiries / g.views * 1000 : 0;
      g.partial = startDate > g.start || endDate < g.end;
      return g;
    });
  }

  function funnelNode(views, sessions, inquiries, coverage) {
    var sendRate = views ? sessions / views * 1000 : 0;
    var inquiryRate = sessions ? inquiries / sessions * 100 : 0;
    var html = '<div class="funnel">' +
      '<div class="funnel-step"><div class="stage">1. YouTube視聴</div><div class="value">' + esc(compact(views)) + '</div><div class="rate">選択期間の再生</div></div>' +
      '<div class="funnel-step"><div class="stage">2. 概要欄から遷移</div><div class="value">' + esc(nf(sessions)) + '</div><div class="rate">1,000視聴あたり ' + esc(nf(sendRate)) + '</div></div>' +
      '<div class="funnel-step"><div class="stage">3. 問い合わせ完了</div><div class="value">' + esc(nf(inquiries)) + '</div><div class="rate">CV_求職者all</div></div>' +
      '<div class="funnel-step"><div class="stage">4. セッション→問い合わせ</div><div class="value">' + esc(pct(inquiryRate, 2)) + '</div><div class="rate">イベント数 ÷ セッション</div></div></div>' +
      '<div class="measurement-note"><span>視聴→遷移は別システム間の参考比率</span><span>UTM動画IDカバレッジ ' + esc(pct((coverage && coverage.rate || 0) * 100, 1)) + '</span><span>CVはイベント数（ユニークリード数ではありません）</span></div>';
    return el('<div>' + html + '</div>');
  }

      var sourceAna = unit === 'month' && monthlyAna && monthlyAna.ok ? monthlyAna : ana;
      var allRows = conversionBuckets(sourceAna.body.reports.daily || [], sourceGa.youtubeDaily || [], sourceGa.youtubeInquiryDaily || [], unit,
        sourceAna.body.period.startDate, sourceAna.body.period.endDate);
      allRows.forEach(function (x, i) { x.previous = i ? allRows[i - 1] : null; });
      var rows = unit === 'month' ? allRows.slice(-6) : allRows;

    if ((d.byVideo || []).length) {

      var anaMeta = dashboardState.ana && dashboardState.ana.ok ? dashboardState.ana.body.videoMetadata || [] : [];
      var analyticsRows = dashboardState.ana && dashboardState.ana.ok ? dashboardState.ana.body.reports.video || [] : [];
      var publicVideos = dashboardState.pub && dashboardState.pub.ok ? dashboardState.pub.body.videos || [] : [];
      var viewsById = {};
      publicVideos.forEach(function (v) { names[v.id] = v.title; });
      anaMeta.forEach(function (v) { names[v.id] = v.title; });
      analyticsRows.forEach(function (v) { viewsById[v.video] = Number(v.views) || 0; });
      d.byVideo.forEach(function (v) {
        v.videoViews = viewsById[v.sessionManualCampaignId] || 0;
        v.sessionPerK = v.videoViews ? v.sessions / v.videoViews * 1000 : null;
        v.inquiryPerK = v.videoViews ? v.inquiries / v.videoViews * 1000 : null;
        v.sessionChange = v.previousSessions ? (v.sessions - v.previousSessions) / v.previousSessions : null;
      });
      var gaIds = {};
      d.byVideo.forEach(function (v) { if (/^[A-Za-z0-9_-]{11}$/.test(v.sessionManualCampaignId || '')) gaIds[v.sessionManualCampaignId] = true; });
      var noTraffic = analyticsRows.filter(function (v) { return Number(v.views) >= 100 && !gaIds[v.video]; })
        .sort(function (a, b) { return Number(b.views) - Number(a.views); }).slice(0, 3);
      var improvementItems = [];
      if (noTraffic.length) improvementItems.push('高視聴・送客未計測：' + noTraffic.map(function (v) {
        return (names[v.video] || v.video) + '（' + nf(v.views) + '視聴）';
      }).join('／') + '。概要欄CTAとutm_idを確認します。');
      if (d.utmCoverage && d.utmCoverage.unattributedSessions) improvementItems.push('動画IDへ帰属できない遷移が' +
        nf(d.utmCoverage.unattributedSessions) + '件あります。誤ったutm_id（' + d.utmCoverage.invalidIds.slice(0, 3).join('、') + '）を修正します。');
      if (ytInquiryCount < 5) improvementItems.push('問い合わせは' + nf(ytInquiryCount) + '件で率の優劣を断定できません。まず概要欄遷移を増やし、10セッション未満の動画は率ランキング対象外にします。');
      if (improvementItems.length) host.appendChild(card('CVを増やす改善対象', '実測値から自動抽出。因果を断定せず、優先確認先を示します。',
        el('<ul class="actions">' + improvementItems.slice(0, 3).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>')));
      var vcols = [
        { key: 'sessionManualCampaignId', head: '動画', render: function (x) {
          var id = x.sessionManualCampaignId, valid = /^[A-Za-z0-9_-]{11}$/.test(id);
          if (!valid) return '<span class="note">UTM動画IDなし（' + esc(id || 'not set') + '）</span>';
          return '<a href="https://www.youtube.com/watch?v=' + esc(id) + '" target="_blank" rel="noopener">' + esc(names[id] || id) + '</a>';
        } },
        { key: 'videoViews', head: '期間内視聴回数', num: true, render: function (x) { return esc(x.videoViews ? nf(x.videoViews) : '—'); } },
        { key: 'sessions', head: '概要欄遷移', num: true, render: function (x) { return esc(nf(x.sessions)); } },
        { key: 'sessionChange', head: '遷移 前期間比', num: true, render: function (x) { return esc(x.sessionChange == null ? '前期間なし' : (x.sessionChange >= 0 ? '+' : '') + pct(x.sessionChange * 100, 1)); } },
        { key: 'sessionPerK', head: '送客 / 1,000視聴', num: true, render: function (x) { return esc(x.sessionPerK == null ? '—' : nf(x.sessionPerK)); } },
        { key: 'activeUsers', head: 'ユーザー', num: true, render: function (x) { return esc(nf(x.activeUsers)); } },
        { key: 'inquiries', head: '問い合わせ完了', num: true, render: function (x) { return esc(nf(x.inquiries)); } },
        { key: 'sessionInquiryRate', head: '問い合わせ率', num: true, render: function (x) { return esc(x.sessions < 10 ? '母数不足' : pct(x.sessionInquiryRate * 100, 2)); } },
        { key: 'inquiryPerK', head: '問い合わせ / 1,000視聴', num: true, render: function (x) { return esc(x.inquiryPerK == null ? '—' : nf(x.inquiryPerK)); } }
      ];
      host.appendChild(card('動画別 サイト送客・問い合わせ',
        'utm_content=' + d.youtubeDescriptionContent + '、utm_id=YouTube動画IDのデータを集計します。UTM未設定分は動画へ帰属できません。',
        sortableTable(vcols, d.byVideo, { defaultSort: 'sessions' })));
    }

    if (d.bySourceMedium.length) {
      host.appendChild(card('参照元／メディア別 セッション', '上位25件。',
        barChart(d.bySourceMedium.map(function (x) {
          return { label: x.sessionSourceMedium, value: x.sessions,
            tip: '<b>' + esc(x.sessionSourceMedium) + '</b><span class="r">セッション ' + esc(nf(x.sessions)) +
                 '<br>ユーザー ' + esc(nf(x.activeUsers)) + '</span>' };
        }), { format: compact })));
    }

    if (d.byPage.length) {
      var pcols = [
        { key: 'pagePath', head: 'ページ' },
        { key: 'screenPageViews', head: 'PV', num: true, render: function (x) { return esc(nf(x.screenPageViews)); } },
        { key: 'sessions', head: 'セッション', num: true, render: function (x) { return esc(nf(x.sessions)); } },
        { key: 'activeUsers', head: 'ユーザー', num: true, render: function (x) { return esc(nf(x.activeUsers)); } }
      ];
      host.appendChild(card('ページ別（上位50）', '列見出しをクリックすると並べ替えできます。', sortableTable(pcols, d.byPage)));
    }
  }

  var dashboardState = { pub: null, ana: null, ga: null, monthlyAna: null, monthlyGa: null };

  function renderOverview() {
    var host = document.getElementById('overview-data');
    var ana = dashboardState.ana, ga = dashboardState.ga;
    if (!ana || !ga) { host.innerHTML = '<div class="skeleton" aria-label="概要を集計中"></div>'; return; }
    host.innerHTML = '';
    if (ana.ok && ga.ok && ana.body.reports) {
      var funnelSummary = (ana.body.reports.summary || [])[0] || {};
      var funnelSessions = Number((ga.body.youtubeSummary || {}).sessions) || 0;
      var funnelInquiries = Number((ga.body.youtubeInquirySummary || {}).eventCount) || 0;
      host.appendChild(card('問い合わせファネル',
        '共通期間 ' + ana.body.period.startDate + ' 〜 ' + ana.body.period.endDate + '。視聴→遷移は参考比率、CVはイベント数です。',
        funnelNode(Number(funnelSummary.views) || 0, funnelSessions, funnelInquiries, ga.body.utmCoverage)));
      var funnelPerK = Number(funnelSummary.views) ? funnelSessions / Number(funnelSummary.views) * 1000 : 0;
      host.appendChild(el('<div class="diagnosis"><strong>まず確認する箇所：概要欄への送客</strong>' +
        esc(nf(funnelSummary.views) + '視聴に対して概要欄遷移は' + nf(funnelSessions) + '件（1,000視聴あたり' + nf(funnelPerK) + '件）。' +
        (funnelInquiries < 5 ? '問い合わせ母数が少ないため、LPの評価より先にCTAとUTMを改善します。' : '次に遷移後の問い合わせ率を改善します。')) + '</div>'));
    }
    host.appendChild(el('<h2 class="section-title">期間サマリー</h2>'));
    var list = [];
    if (ana.ok && ana.body.reports) {
      var ys = (ana.body.reports.summary || [])[0] || {}, yp = ana.body.previousSummary || {};
      var ySubs = (Number(ys.subscribersGained) || 0) - (Number(ys.subscribersLost) || 0);
      var ypSubs = (Number(yp.subscribersGained) || 0) - (Number(yp.subscribersLost) || 0);
      list.push(['YouTube 視聴回数', compact(ys.views), '選択期間', delta(ys.views, yp.views)]);
      list.push(['総再生時間', nf(Math.round((Number(ys.estimatedMinutesWatched) || 0) / 60)) + ' 時間', '選択期間',
        delta(ys.estimatedMinutesWatched, yp.estimatedMinutesWatched)]);
      list.push(['登録者純増', (ySubs >= 0 ? '+' : '') + nf(ySubs), '登録増 − 登録解除', delta(ySubs, ypSubs)]);
    }
    if (ga.ok) {
      var gs = ga.body.youtubeSummary || {}, gp = ga.body.previousYoutubeSummary || {};
      var gi = ga.body.youtubeInquirySummary || {}, gip = ga.body.previousYoutubeInquirySummary || {};
      var gSessions = Number(gs.sessions) || 0, gInquiries = Number(gi.eventCount) || 0;
      list.push(['YouTube概要欄 遷移セッション', nf(gSessions), 'utm_content: ' + ga.body.youtubeDescriptionContent, delta(gSessions, gp.sessions)]);
      list.push(['YouTube概要欄 問い合わせ完了', nf(gInquiries), ga.body.inquiryEventName, delta(gInquiries, gip.eventCount)]);
      list.push(['YouTube概要欄 問い合わせ率', pct((gSessions ? gInquiries / gSessions : 0) * 100, 2),
        '問い合わせ完了 ÷ 遷移セッション']);
    }
    host.appendChild(tiles(list));

    if (ana.ok && ana.body.reports && ana.body.reports.video) {
      var names = {};
      (ana.body.videoMetadata || []).forEach(function (v) { names[v.id] = v.title; });
      var top3 = ana.body.reports.video.slice().sort(function (a, b) { return Number(b.views) - Number(a.views); }).slice(0, 3);
      if (top3.length) host.appendChild(card('伸びた動画 トップ3', '選択期間の視聴回数。次の企画判断に使います。',
        barChart(top3.map(function (v) { return { label: names[v.video] || '動画', value: v.views }; }), { format: compact })));

      var actions = [];
      var currentSummary = (ana.body.reports.summary || [])[0] || {}, prevSummary = ana.body.previousSummary || {};
      if (Number(prevSummary.views)) {
        var viewRate = (Number(currentSummary.views) - Number(prevSummary.views)) / Number(prevSummary.views) * 100;
        actions.push('視聴回数は前期間比' + (viewRate >= 0 ? '+' : '') + viewRate.toFixed(1) + '%。' +
          (viewRate >= 0 ? 'トップ3のテーマを次回企画へ展開します。' : '流入元と公開本数を確認し、下落要因を切り分けます。'));
      }
      if (ga.ok) {
        var ytSessions = Number((ga.body.youtubeSummary || {}).sessions) || 0;
        var views = Number(currentSummary.views) || 0;
        actions.push(views && ytSessions / views < 0.001
          ? '視聴に対して概要欄遷移が少ないため、CTAとutm_content=agent-ch_descの設定を確認します。'
          : '動画別の概要欄遷移と問い合わせを確認し、反応のよいCTAを他動画へ横展開します。');
      }
      var best = ana.body.reports.video.filter(function (v) { return Number(v.views) >= 100; })
        .sort(function (a, b) { return (Number(b.subscribersGained) / Number(b.views)) - (Number(a.subscribersGained) / Number(a.views)); })[0];
      if (best) actions.push('登録者獲得効率が高い「' + (names[best.video] || '上位動画') + '」のテーマ・構成を再利用します。');
      if (actions.length) host.appendChild(card('今やること', 'データから自動生成した確認項目。',
        el('<ul class="actions">' + actions.slice(0, 3).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>')));
    }
  }

  function dateUTC(s) { return new Date(normDate(s) + 'T00:00:00Z'); }
  function isoUTC(d) { return d.toISOString().slice(0, 10); }
  function bucketInfo(date, unit) {
    var d = dateUTC(date), start = new Date(d), end = new Date(d);
    if (unit === 'week') {
      var offset = (d.getUTCDay() + 6) % 7;
      start.setUTCDate(d.getUTCDate() - offset); end = new Date(start); end.setUTCDate(start.getUTCDate() + 6);
      return { key: isoUTC(start), start: isoUTC(start), end: isoUTC(end) };
    }
    if (unit === 'month') {
      start = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1));
      end = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0));
      return { key: isoUTC(start), start: isoUTC(start), end: isoUTC(end) };
    }
    return { key: normDate(date), start: normDate(date), end: normDate(date) };
  }

  function aggregateRows(rows, unit) {
    var groups = {}, first = rows.length ? normDate(rows[0].day) : '', last = rows.length ? normDate(rows[rows.length - 1].day) : '';
    rows.forEach(function (r) {
      var b = bucketInfo(r.day, unit), g = groups[b.key];
      if (!g) g = groups[b.key] = { period: b.key, start: b.start, end: b.end, views: 0, watchMin: 0, gained: 0, lost: 0, weightedRetention: 0, weightedDuration: 0 };
      var views = Number(r.views) || 0;
      g.views += views; g.watchMin += Number(r.estimatedMinutesWatched) || 0;
      g.gained += Number(r.subscribersGained) || 0; g.lost += Number(r.subscribersLost) || 0;
      g.weightedRetention += (Number(r.averageViewPercentage) || 0) * views;
      g.weightedDuration += (Number(r.averageViewDuration) || 0) * views;
    });
    return Object.keys(groups).sort().map(function (k) {
      var g = groups[k]; g.netSubs = g.gained - g.lost;
      g.retention = g.views ? g.weightedRetention / g.views : 0;
      g.avgDuration = g.views ? g.weightedDuration / g.views : 0;
      g.partial = (first && first > g.start) || (last && last < g.end);
      return g;
    });
  }

  function timeAnalysis(rows, initialUnit, monthlyRows) {
    var host = el('<div></div>');
    var controls = el('<div class="analysis-controls">' +
      '<label>集計単位<select data-role="unit"><option value="day">日次</option><option value="week">週次</option><option value="month">月次</option></select></label>' +
      '<label>表示指標<select data-role="metric"><option value="views">視聴回数</option><option value="watchMin">総再生時間</option><option value="retention">平均視聴維持率（参考）</option></select></label></div>');
    var compareHost = el('<div></div>'), chartHost = el('<div></div>'), tableHost = el('<div></div>');
    controls.querySelector('[data-role="unit"]').value = initialUnit || 'week';
    function draw() {
      var unit = controls.querySelector('[data-role="unit"]').value;
      var metric = controls.querySelector('[data-role="metric"]').value;
      var allGrouped = aggregateRows(unit === 'month' && monthlyRows && monthlyRows.length ? monthlyRows : rows, unit);
      allGrouped.forEach(function (g, i) { g.previous = i ? allGrouped[i - 1] : null; });
      var grouped = unit === 'month' ? allGrouped.slice(-6) : allGrouped;
      var labels = { views: '視聴回数', watchMin: '総再生時間（分）', netSubs: '登録者純増', retention: '平均視聴維持率（視聴回数加重）' };
      chartHost.innerHTML = '';
      compareHost.innerHTML = '';
      var complete = grouped.filter(function (g) { return !g.partial; });
      if (unit !== 'day' && complete.length >= 2) {
        var latest = complete[complete.length - 1], previous = complete[complete.length - 2];
        compareHost.appendChild(tiles([
          ['直近完了' + (unit === 'week' ? '週' : '月') + ' 視聴回数', compact(latest.views), latest.start + ' 〜 ' + latest.end, delta(latest.views, previous.views, unit === 'month' ? '前月比' : '前期間比')],
          ['直近完了' + (unit === 'week' ? '週' : '月') + ' 総再生時間', watchAmount(latest.watchMin), unit === 'month' ? '前月と比較' : '前期間と比較', delta(latest.watchMin, previous.watchMin, unit === 'month' ? '前月比' : '前期間比')],
          ['直近完了' + (unit === 'week' ? '週' : '月') + ' 登録者純増', (latest.netSubs >= 0 ? '+' : '') + nf(latest.netSubs), (unit === 'month' ? '前月 ' : '前期間 ') + (previous.netSubs >= 0 ? '+' : '') + nf(previous.netSubs), delta(latest.netSubs, previous.netSubs, unit === 'month' ? '前月比' : '前期間比')]
        ]));
      }
      chartHost.appendChild(columnChart(grouped.map(function (g) {
        var label = unit === 'day' ? g.start : g.start + ' 〜 ' + g.end;
        return { label: label, short: unit === 'month' ? g.start.slice(0, 7) : g.start.slice(5), value: Number(g[metric]) || 0,
          tip: '<b>' + esc(label) + (g.partial ? '（集計途中）' : '') + '</b><span class="r">' + esc(labels[metric]) + ' ' +
            esc(metric === 'retention' ? pct(g[metric], 1) : nf(Math.round(g[metric]))) + '</span>' };
      }), { axisFormat: metric === 'retention' ? function (v) { return pct(v, 0); } : compact }));
      var cols = [
        { key: 'period', head: '集計期間', render: function (g) { return esc(unit === 'day' ? g.start : g.start + ' 〜 ' + g.end) + (g.partial ? '<span class="partial">集計途中</span>' : ''); } },
        { key: 'views', head: '視聴回数', num: true, render: function (g) { return esc(nf(g.views)) + (unit === 'month' && g.previous ? mom(g.views, g.previous.views, g.partial) : ''); } },
        { key: 'watchMin', head: '総再生時間', num: true, render: function (g) { return esc(watchAmount(g.watchMin)) + (unit === 'month' && g.previous ? mom(g.watchMin, g.previous.watchMin, g.partial) : ''); } },
        { key: 'retention', head: '維持率', num: true, render: function (g) { return esc(pct(g.retention, 1)) + (unit === 'month' && g.previous ? mom(g.retention, g.previous.retention, g.partial) : ''); } },
        { key: 'netSubs', head: '登録者純増', num: true, render: function (g) { return esc((g.netSubs >= 0 ? '+' : '') + nf(g.netSubs)) + (unit === 'month' && g.previous ? mom(g.netSubs, g.previous.netSubs, g.partial) : ''); } }
      ];
      tableHost.innerHTML = ''; tableHost.appendChild(sortableTable(cols, grouped, { defaultSort: 'period' }));
    }
    controls.addEventListener('change', draw); host.appendChild(controls); host.appendChild(compareHost); host.appendChild(chartHost); host.appendChild(tableHost); draw();
    return host;
  }

  // =================== 読み込み ===================
  function loadAll() {
    days = parseInt(document.getElementById('range').value, 10) || 90;
    ['yt', 'ga'].forEach(function (id) { setStatus(id, '確認中', ''); });
    ['yt-body', 'ga-body'].forEach(function (id) {
      document.getElementById(id).innerHTML = '<div class="skeleton" aria-label="読み込み中"></div><div class="skeleton" aria-hidden="true"></div>';
    });

    // 片方が通信エラーでも、もう片方は描けるようにする。
    // Promise.all だと Analytics が落ちただけで公開指標まで道連れになる。
    function softFail(e) { return { ok: false, status: 0, body: { message: '通信エラー: ' + e.message }, path: '' }; }

    Promise.all([
      getJSON('/api/youtube?max=200').catch(softFail),
      getJSON('/api/youtube-analytics?days=' + days).catch(softFail)
    ]).then(function (res) {
      dashboardState.pub = res[0]; dashboardState.ana = res[1];
      renderYouTube(res[0], res[1]);
      if (dashboardState.ga) renderGA4(dashboardState.ga);
      renderOverview();
    });

    getJSON('/api/ga4?days=' + days).catch(softFail).then(function (r) {
      dashboardState.ga = r; renderGA4(r); renderOverview();
    });

    if (!dashboardState.monthlyAna || !dashboardState.monthlyGa) {
      Promise.all([
        getJSON('/api/youtube-analytics?days=210').catch(softFail),
        getJSON('/api/ga4?days=210').catch(softFail)
      ]).then(function (res) {
        dashboardState.monthlyAna = res[0]; dashboardState.monthlyGa = res[1];
        if (dashboardState.pub && dashboardState.ana) renderYouTube(dashboardState.pub, dashboardState.ana);
        if (dashboardState.ga) renderGA4(dashboardState.ga);
      });
    }
  }

  function selectTab(name, updateHash) {
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (x) {
      var selected = x.dataset.tab === name;
      x.setAttribute('aria-selected', String(selected));
      document.getElementById('panel-' + x.dataset.tab).classList.toggle('hide', !selected);
    });
    if (updateHash) history.replaceState(null, '', name === 'overview' ? '#overview' : name === 'yt' ? '#youtube' : '#ga4');
  }

  document.addEventListener('mouseover', function (e) {
    var button = e.target.closest && e.target.closest('.help');
    if (button) showHelp(button, e);
  });
  document.addEventListener('mouseout', function (e) {
    var button = e.target.closest && e.target.closest('.help');
    if (button && button !== pinnedHelp && !button.contains(e.relatedTarget)) hideTip();
  });
  document.addEventListener('focusin', function (e) {
    var button = e.target.closest && e.target.closest('.help');
    if (button) showHelp(button);
  });
  document.addEventListener('focusout', function (e) {
    if (e.target.closest && e.target.closest('.help') !== pinnedHelp) hideTip();
  });
  document.addEventListener('click', function (e) {
    var button = e.target.closest && e.target.closest('.help');
    if (button) {
      e.preventDefault(); e.stopPropagation();
      pinnedHelp = pinnedHelp === button ? null : button;
      if (pinnedHelp) showHelp(button, e); else hideTip(true);
    } else hideTip(true);
  }, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideTip(true); });

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.addEventListener('click', function () { selectTab(t.dataset.tab, true); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-open-tab]'), function (b) {
    b.addEventListener('click', function () {
      selectTab(b.dataset.openTab, true);
    });
  });
  document.getElementById('reload').addEventListener('click', loadAll);
  document.getElementById('range').addEventListener('change', loadAll);

  var initialHash = location.hash === '#youtube' ? 'yt' : location.hash === '#ga4' ? 'ga' : 'overview';
  selectTab(initialHash, false);
  loadAll();
})();
